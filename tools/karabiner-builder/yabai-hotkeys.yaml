title: macOS Yabai Window Management
version: 1.0.0
maintainers:
  - rqdmap
author: rqdmap(rqdmap@gmail.com)

outputs:
  karabiner: yabai-hotkeys.json
  skhd: yabai-hotkeys.skhdrc


# ---------------------------------------------------------------
# Event bus: sequential slot assignment for F-key combos
# Run `build.py yabai-hotkeys.yaml --slots` to see the full allocation table
# ---------------------------------------------------------------
events_start_slot: 0

events:
  - wm_focus_west
  - wm_focus_south
  - wm_focus_north
  - wm_focus_east
  - wm_swap_west
  - wm_swap_south
  - wm_swap_north
  - wm_swap_east
  - wm_space_1
  - wm_space_2
  - wm_space_3
  - wm_space_4
  - wm_space_5
  - wm_space_6
  - wm_space_7
  - wm_space_8
  - wm_space_9
  - wm_space_10
  - wm_space_11
  - wm_send_space_1
  - wm_send_space_2
  - wm_send_space_3
  - wm_send_space_4
  - wm_send_space_5
  - wm_send_space_6
  - wm_send_space_7
  - wm_send_space_8
  - wm_send_space_9
  - wm_send_space_10
  - wm_send_space_11
  - wm_toggle_float
  - wm_toggle_fullscreen
  - wm_resize_left_grow
  - wm_resize_down_grow
  - wm_resize_up_grow
  - wm_resize_right_grow
  - wm_resize_left_shrink
  - wm_resize_down_shrink
  - wm_resize_up_shrink
  - wm_resize_right_shrink

actions:
  # focus window (with cross-display fallback)
  wm_focus_west: yabai -m window --focus west || yabai -m display --focus west
  wm_focus_south: yabai -m window --focus south || yabai -m display --focus south
  wm_focus_north: yabai -m window --focus north || yabai -m display --focus north
  wm_focus_east: yabai -m window --focus east || yabai -m display --focus east

  # swap managed window
  wm_swap_west: yabai -m window --swap west
  wm_swap_south: yabai -m window --swap south
  wm_swap_north: yabai -m window --swap north
  wm_swap_east: yabai -m window --swap east

  # fast focus desktop
  wm_space_1: yabai -m space --focus 1
  wm_space_2: yabai -m space --focus 2
  wm_space_3: yabai -m space --focus 3
  wm_space_4: yabai -m space --focus 4
  wm_space_5: yabai -m space --focus 5
  wm_space_6: yabai -m space --focus 6
  wm_space_7: yabai -m space --focus 7
  wm_space_8: yabai -m space --focus 8
  wm_space_9: yabai -m space --focus 9
  wm_space_10: yabai -m space --focus 10
  wm_space_11: yabai -m space --focus 11

  # send window to desktop
  wm_send_space_1: yabai -m window --space 1
  wm_send_space_2: yabai -m window --space 2
  wm_send_space_3: yabai -m window --space 3
  wm_send_space_4: yabai -m window --space 4
  wm_send_space_5: yabai -m window --space 5
  wm_send_space_6: yabai -m window --space 6
  wm_send_space_7: yabai -m window --space 7
  wm_send_space_8: yabai -m window --space 8
  wm_send_space_9: yabai -m window --space 9
  wm_send_space_10: yabai -m window --space 10
  wm_send_space_11: yabai -m window --space 11

  # float / unfloat window and center on screen
  wm_toggle_float: yabai -m window --toggle float --grid 4:4:1:1:2:2

  # toggle window zoom
  wm_toggle_fullscreen: yabai -m window --toggle zoom-fullscreen

  # resize window
  wm_resize_left_grow: yabai -m window --resize left:-20:0
  wm_resize_down_grow: yabai -m window --resize bottom:0:+20
  wm_resize_up_grow: yabai -m window --resize top:0:-20
  wm_resize_right_grow: yabai -m window --resize right:+20:0
  wm_resize_left_shrink: yabai -m window --resize right:-20:0
  wm_resize_down_shrink: yabai -m window --resize top:0:+20
  wm_resize_up_shrink: yabai -m window --resize bottom:0:-20
  wm_resize_right_shrink: yabai -m window --resize left:+20:0

rules:
  - description: Yabai window management
    manipulators:
      - description: Focus window west
        map: left_command + h = @wm_focus_west
      - description: Focus window south
        map: left_command + j = @wm_focus_south
      - description: Focus window north
        map: left_command + k = @wm_focus_north
      - description: Focus window east
        map: left_command + l = @wm_focus_east

      - description: Swap window west
        map: left_shift + left_command + h = @wm_swap_west
      - description: Swap window south
        map: left_shift + left_command + j = @wm_swap_south
      - description: Swap window north
        map: left_shift + left_command + k = @wm_swap_north
      - description: Swap window east
        map: left_shift + left_command + l = @wm_swap_east

      - description: Focus space 1
        map: left_command + 1 = @wm_space_1
      - description: Focus space 2
        map: left_command + 2 = @wm_space_2
      - description: Focus space 3
        map: left_command + 3 = @wm_space_3
      - description: Focus space 4
        map: left_command + 4 = @wm_space_4
      - description: Focus space 5
        map: left_command + 5 = @wm_space_5
      - description: Focus space 6
        map: left_command + 6 = @wm_space_6
      - description: Focus space 7
        map: left_command + 7 = @wm_space_7
      - description: Focus space 8
        map: left_command + 8 = @wm_space_8
      - description: Focus space 9
        map: left_command + 9 = @wm_space_9
      - description: Focus space 10
        map: left_command + 0 = @wm_space_10
      - description: Focus space 11
        map: left_command + hyphen = @wm_space_11

      - description: Send window to space 1
        map: left_shift + left_command + 1 = @wm_send_space_1
      - description: Send window to space 2
        map: left_shift + left_command + 2 = @wm_send_space_2
      - description: Send window to space 3
        map: left_shift + left_command + 3 = @wm_send_space_3
      - description: Send window to space 4
        map: left_shift + left_command + 4 = @wm_send_space_4
      - description: Send window to space 5
        map: left_shift + left_command + 5 = @wm_send_space_5
      - description: Send window to space 6
        map: left_shift + left_command + 6 = @wm_send_space_6
      - description: Send window to space 7
        map: left_shift + left_command + 7 = @wm_send_space_7
      - description: Send window to space 8
        map: left_shift + left_command + 8 = @wm_send_space_8
      - description: Send window to space 9
        map: left_shift + left_command + 9 = @wm_send_space_9
      - description: Send window to space 10
        map: left_shift + left_command + 0 = @wm_send_space_10
      - description: Send window to space 11
        map: left_shift + left_command + hyphen = @wm_send_space_11

      - description: Toggle floating window
        map: left_command + s = @wm_toggle_float
      - description: Toggle fullscreen window
        map: left_command + f = @wm_toggle_fullscreen

      - description: Grow window left
        map: left_control + left_command + h = @wm_resize_left_grow
      - description: Grow window down
        map: left_control + left_command + j = @wm_resize_down_grow
      - description: Grow window up
        map: left_control + left_command + k = @wm_resize_up_grow
      - description: Grow window right
        map: left_control + left_command + l = @wm_resize_right_grow
      - description: Shrink window left
        map: left_shift + left_control + left_command + h = @wm_resize_left_shrink
      - description: Shrink window down
        map: left_shift + left_control + left_command + j = @wm_resize_down_shrink
      - description: Shrink window up
        map: left_shift + left_control + left_command + k = @wm_resize_up_shrink
      - description: Shrink window right
        map: left_shift + left_control + left_command + l = @wm_resize_right_shrink
